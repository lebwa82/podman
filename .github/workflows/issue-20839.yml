name: Issue 20839 regression

on:
  push:
    branches:
      - ci/issue-20839

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PODMAN_TEST_TAGS: containers_image_openpgp exclude_graphdriver_btrfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build Podman
        run: make podman BUILDTAGS="$PODMAN_TEST_TAGS"
      - name: Test build API handlers
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/podman-runtime.XXXXXXXX")"
          go test -mod=vendor -count=1 -tags "$PODMAN_TEST_TAGS" -v ./pkg/api/handlers/compat ./pkg/api/handlers/utils
